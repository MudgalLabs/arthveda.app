name: build and publish

on:
    push:
        branches: ["main"]
    workflow_dispatch:

# A newer push supersedes an in-flight deploy instead of racing it.
concurrency:
    group: deploy-main
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # NEXT_PUBLIC_* values are inlined into the client bundle at build
            # time, so they must be build args. Setting them in the VPS .env
            # does nothing for an image built here.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/arthveda_app:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/arthveda_app:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                      NEXT_PUBLIC_GRAHAK_PROJECT_ID=${{ vars.NEXT_PUBLIC_GRAHAK_PROJECT_ID }}
                      NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}

    deploy:
        name: Deploy to VPS
        needs: [build]
        runs-on: ubuntu-latest

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -euo pipefail

                      cd ${{ secrets.WORK_DIR }}

                      echo "--- Pulling latest code ---"
                      git pull origin main

                      echo "--- Logging in to DockerHub ---"
                      echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

                      echo "--- Pulling latest image ---"
                      docker compose pull arthveda_app

                      echo "--- Restarting app ---"
                      docker compose up -d --no-build --pull never arthveda_app

                      echo "--- Cleaning up old images ---"
                      docker image prune -f

                      echo "--- Done ---"

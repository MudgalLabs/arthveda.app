services:
    arthveda_app:
        container_name: arthveda_app
        # Built and pushed by .github/workflows/build-and-publish.yaml.
        # Do not build on the VPS: a Next.js build there exhausts its memory.
        image: ceoshikhar/arthveda_app:latest
        env_file:
            - .env
        environment:
            NODE_ENV: production
        expose:
            - "3000"
        networks:
            - caddy_net
        restart: unless-stopped

networks:
    caddy_net:
        external: true
